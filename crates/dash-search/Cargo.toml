[package]
name = "dash-search"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "File search: filename + content indexes, queries, ranking, extraction, OCR, meaning search"

[features]
default = []
# The ONNX runtime (shared with other ONNX users in the host app).
onnx = ["dep:ort", "ort/download-binaries", "ort/tls-native"]
# Meaning search with EmbeddingGemma.
semantic = ["onnx", "dep:tokenizers"]
# In-process libtesseract (else tesseract.exe is spawned).
ocr-leptess = ["dep:leptess"]

[dependencies]
dash-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
blake3.workspace = true
image.workspace = true
tantivy = "0.26"
notify = "8"
ignore = "0.4"
walkdir = "2"
rayon = "1.10"
redb = "2"
lopdf = "0.34"
pdfium-render = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }
quick-xml = { version = "0.36.2", features = ["serialize"] }
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
open = "5.3.3"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
leptess = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
# Reads .lnk shortcuts so icons come from the real app (no arrow overlay).
parselnk = "0.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# File and app icons (launcher_icons/macos.rs): NSWorkspace's icon, a TIFF
# with a page per size. Versions already in the lock file (2026-11-02).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage"] }
tiff = "=0.11.3"

# File and app icons (launcher_icons/linux.rs): SVG icon themes drawn with
# resvg, as GPUI does. Version already in the lock file (2026-11-02).
[target.'cfg(target_os = "linux")'.dependencies]
resvg = { version = "=0.45.1", default-features = false }

[lints]
workspace = true
