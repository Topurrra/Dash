[package]
name = "dash-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "What Dash's engines need from their app, plus shared helpers"

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
fancy-regex.workspace = true
redb = "2"
# Link token. Already in the workspace's lock file (via other crates).
getrandom = "0.3.4"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Encryption at rest on macOS / Linux (at_rest.rs): the key in the macOS
# Keychain or the Secret Service. Pinned (2026-11-02).
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
