# Dash — file search and clipboard history: the engine crates and the
# overlay app
# (GPUI). Lives here until it moves to its own repository.
[workspace]
members = ["crates/dash-core", "crates/dash-clipboard", "crates/dash-search", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
dash-core = { path = "crates/dash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
fancy-regex = "0.16"
blake3 = "1.5"
image = { version = "0.25.0", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico", "gif"] }
windows = "0.54.0"
