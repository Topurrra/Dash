# Dash — file search and clipboard history: the engine crates and the
# overlay app
# (GPUI). Lives here until it moves to its own repository.
[workspace]
members = ["crates/dash-core", "crates/dash-clipboard", "crates/dash-search", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Correctness first (from BeautifulRust's set): what can panic, lose data in a
# cast, or hide an unsafe assumption. Style and pedantic lints come later.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
dash-core = { path = "crates/dash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
fancy-regex = "0.16"
blake3 = "1.5"
image = { version = "0.25.0", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico", "gif"] }
windows = "0.54.0"
