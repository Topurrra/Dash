# Dash — file search and clipboard history: the engine crates and the
# overlay app
# (GPUI). Lives here until it moves to its own repository.
[workspace]
members = ["crates/dash-core", "crates/dash-clipboard", "crates/dash-search", "app"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# BeautifulRust's set: correctness (what can panic, lose data in a cast, or
# hide an unsafe assumption) and style / pedantic.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
string_add = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"
dbg_macro = "warn"
todo = "warn"
# Off on purpose: the search/ parts see each other through `use super::*`;
# splitting the long index-build functions is a refactor of its own; the
# last two are noise (BeautifulRust turns them off too).
wildcard_imports = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Its fix, `assert_eq!(x, [] as [T; 0])`, is an `as` cast `as_conversions`
# then flags; `assert!(x.is_empty())` stays.
assert_is_empty = "allow"

[workspace.dependencies]
dash-core = { path = "crates/dash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
fancy-regex = "0.16"
blake3 = "1.5"
image = { version = "0.25.0", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico", "gif"] }
windows = "0.54.0"
