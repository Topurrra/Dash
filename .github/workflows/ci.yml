name: CI

# Builds and tests Dash on all three systems. macOS and Linux are only
# checked here — nobody runs them by eye yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A normal run takes well under this; a hung test shouldn't hold a
    # runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The version and components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # GPUI (X11 / Wayland, Vulkan, fonts), sound (ALSA), tray (D-Bus).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libasound2-dev libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libssl-dev libzstd-dev libgtk-3-dev libxdo-dev

      - name: Build
        run: cargo build --locked -p dash

      - name: Tests
        run: cargo test --locked --workspace
        # A runner's keychain can't answer macOS's access prompt; tests
        # would wait on it forever.
        env:
          DASH_NO_KEYCHAIN: "1"

      # Formatting is the same everywhere: checked once.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The lints (Cargo.toml [workspace.lints]) must stay clean on every
      # system: each has its own code paths.
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        if: runner.os != 'Windows'
        run: cargo build --locked --release -p dash

      # The Windows installer needs runtimes that aren't in the repository
      # (installer/build.ps1); the .dmg and AppImage don't.
      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh

      - name: Package (AppImage)
        if: runner.os == 'Linux'
        run: packaging/linux/make_appimage.sh

      - name: Keep the package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dash-${{ runner.os }}
          path: |
            target/package/*.dmg
            target/package/*.AppImage
            target/package/*.sha256
          retention-days: 14
