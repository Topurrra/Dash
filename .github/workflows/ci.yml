name: CI

# Builds and tests Dash on all three systems. macOS and Linux are only
# checked here — nobody runs them by eye yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # GPUI (X11 / Wayland, Vulkan, fonts), sound (ALSA), tray (D-Bus).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libasound2-dev libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libssl-dev libzstd-dev libgtk-3-dev libxdo-dev

      - name: Build
        run: cargo build --locked -p dash

      - name: Tests
        run: cargo test --locked --workspace

      # Formatting is the same everywhere: checked once.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The correctness lints (Cargo.toml [workspace.lints]) must stay clean.
      # Windows only for now: the macOS / Linux code paths haven't been
      # through them yet.
      - name: Lints
        if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        if: runner.os != 'Windows'
        run: cargo build --locked --release -p dash

      - name: Keep the binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dash-${{ runner.os }}
          path: target/release/dash
          retention-days: 14
