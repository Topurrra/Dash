name: Release

# When a release is published (with the Windows installer, built locally by
# installer/build.ps1), adds the macOS .dmg and the Linux AppImage to it,
# each with its .sha256 for the updater.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the packages to (e.g. v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: packaging/macos/make_dmg.sh
          - os: ubuntu-latest
            script: packaging/linux/make_appimage.sh
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The version and components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libasound2-dev libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libssl-dev libzstd-dev libgtk-3-dev libxdo-dev

      - name: Release build
        run: cargo build --locked --release -p dash

      - name: Package
        run: ${{ matrix.script }}

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" target/package/*.dmg target/package/*.AppImage target/package/*.sha256 --clobber
        shell: bash -O nullglob {0}
